<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XMenz - Gaming Streamer</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Floating background icons */
      .floating-icon {
        position: absolute;
        opacity: 0.08;
        animation: float 10s infinite linear;
      }

      @keyframes float {
        0% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-25px) rotate(15deg);
        }
        100% {
          transform: translateY(0) rotate(0deg);
        }
      }

      /* Mascot animation (floating + glow) */
      @keyframes mascotFloat {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-14px);
        }
        100% {
          transform: translateY(0);
        }
      }

      @keyframes glowPulse {
        0% {
          filter: drop-shadow(0 0 12px #ff1e1e);
        }
        50% {
          filter: drop-shadow(0 0 22px #1e90ff);
        }
        100% {
          filter: drop-shadow(0 0 12px #ff1e1e);
        }
      }

      /* Fade-in general */
      .fade-in {
        animation: fadeIn 1.2s ease forwards;
        opacity: 0;
      }
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      /* Popup fade */
      .fade-popup {
        animation: popupFade 0.35s ease forwards;
      }
      @keyframes popupFade {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Ripple Click Effect */
      .ripple {
        position: absolute;
        width: 12px;
        height: 12px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
        animation: rippleEffect 0.6s linear;
      }

      @keyframes rippleEffect {
        from {
          transform: scale(1);
          opacity: 0.6;
        }
        to {
          transform: scale(18);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body class="bg-[#0b0e17] text-white overflow-auto relative min-h-screen">
    <!-- Floating icons -->
    <img
      src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"
      class="floating-icon w-16 left-8 top-24"
      style="animation-duration: 11s"
    />
    <img
      src="https://cdn-icons-png.flaticon.com/512/1384/1384062.png"
      class="floating-icon w-20 right-10 top-64"
      style="animation-duration: 13s"
    />
    <img
      src="https://cdn-icons-png.flaticon.com/512/1384/1384061.png"
      class="floating-icon w-16 left-1/2 top-96"
      style="animation-duration: 15s"
    />

    <!-- HERO -->
    <section
      class="flex flex-col items-center text-center px-6 py-12 min-h-screen justify-center"
    >
      <!-- Logo -->
      <img
        src="assets/xmenz.jpg"
        id="mascot"
        alt="XMenz Logo"
        class="w-44 rounded-full md:w-52"
        style="
          animation: mascotFloat 4s infinite ease-in-out,
            glowPulse 3.5s infinite ease-in-out, fadeInLogo 1.2s ease forwards;
          opacity: 1;
        "
      />

      <style>
        @keyframes fadeInLogo {
          0% {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
      </style>

      <!-- Title -->
      <h1
        class="text-4xl md:text-5xl font-extrabold mt-6"
        style="
          animation-delay: 0.3s;
          background: linear-gradient(90deg, #ff1e1e, #ffffff, #1e90ff);
          background-size: 200% 200%;
          background-position: 0% 50%;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          animation: gradientAnim 5s ease infinite,
            fadeInTitle 1.2s ease forwards;
          opacity: 1;
        "
      >
        XMenz Gaming
      </h1>

      <style>
        @keyframes gradientAnim {
          0% {
            background-position: 0% 50%;
          }
          50% {
            background-position: 100% 50%;
          }
          100% {
            background-position: 0% 50%;
          }
        }
        @keyframes fadeInTitle {
          0% {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
      </style>

      <p
        class="text-gray-300 max-w-md mt-4 fade-in"
        style="animation-delay: 0.4s"
      >
        Streamer gaming dengan gaya elegan dan berkarisma. Ayo dukung perjalanan
        XMenz!
      </p>

      <!-- Media vertical list -->
      <div
        class="mt-10 flex flex-col gap-4 items-center w-full max-w-xs fade-in"
        style="animation-delay: 0.6s"
      >
        <a
          href="https://youtube.com"
          target="_blank"
          class="w-full py-3 rounded-lg bg-red-600 hover:bg-red-700 duration-200 shadow-md flex items-center justify-center gap-2"
        >
          <img
            src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"
            class="w-6"
          />
          YouTube
        </a>

        <a
          href="https://tiktok.com"
          target="_blank"
          class="w-full py-3 rounded-lg bg-white text-black hover:bg-gray-300 duration-200 shadow-md flex items-center justify-center gap-2"
        >
          <img
            src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png"
            class="w-6"
          />
          TikTok
        </a>

        <a
          href="https://saweria.co"
          target="_blank"
          class="w-full py-3 rounded-lg bg-yellow-500 hover:bg-yellow-600 duration-200 shadow-md flex items-center justify-center gap-2"
        >
          <img
            src="https://cdn-icons-png.flaticon.com/128/1177/1177568.png"
            class="w-6"
          />
          Saweria
        </a>

        <!-- IG & FB Popup -->
        <button
          onclick="showInfoPopup()"
          class="w-full py-3 rounded-lg bg-pink-600 hover:bg-pink-700 duration-200 shadow-md flex items-center justify-center gap-2"
        >
          <img
            src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"
            class="w-6"
          />
          Instagram
        </button>

        <button
          onclick="showInfoPopup()"
          class="w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-700 duration-200 shadow-md flex items-center justify-center gap-2"
        >
          <img
            src="https://cdn-icons-png.flaticon.com/512/733/733547.png"
            class="w-6"
          />
          Facebook
        </button>
      </div>
    </section>

    <!-- POPUP -->
    <div
      id="popup"
      class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center"
    >
      <div
        class="bg-[#161922] p-6 rounded-xl shadow-xl border border-gray-700 fade-popup max-w-xs w-full mx-4"
      >
        <h2 class="text-xl mb-3 font-semibold text-red-400">Informasi</h2>
        <p class="text-gray-300 mb-4">Saat ini XMenz baru aktif di:</p>

        <div class="flex flex-col gap-3">
          <a
            href="https://youtube.com"
            target="_blank"
            class="py-2 rounded-lg bg-red-600 hover:bg-red-700"
            >YouTube</a
          >
          <a
            href="https://tiktok.com"
            target="_blank"
            class="py-2 rounded-lg bg-white text-black hover:bg-gray-300"
            >TikTok</a
          >
          <a
            href="https://saweria.co"
            target="_blank"
            class="py-2 rounded-lg bg-yellow-500 hover:bg-yellow-600"
            >Saweria</a
          >
        </div>

        <button
          onclick="closePopup()"
          class="mt-5 w-full py-2 bg-gray-700 hover:bg-gray-600 rounded-lg duration-200"
        >
          Tutup
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
